    合辑的规则:
    1. 你可以创建一个合辑，以合辑的形式预售你的文章；
    2. 合辑出售时，Quill 将收取 10% 作为管理费，其余 90% 为作者收益；
    3. 合辑内的每一篇文章均可以单独出售，单独出售获得的收益有一部分将作为合辑收益，平分给所有合辑购买者。

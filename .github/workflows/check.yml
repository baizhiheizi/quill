name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &check_paths
      - app/**
      - bin/**
      - config/**
      - db/**
      - lib/**
      - test/**
      - vendor/**
      - public/**
      - Gemfile
      - Gemfile.lock
      - package.json
      - bun.lock
      - config.ru
      - Rakefile
      - mise.toml
      - .ruby-version
      - .rubocop.yml
      - .prettierignore
      - esbuild.config.js
      - esbuild.inject.js
      - tsconfig.json
      - tslint.json
      - Procfile.dev
      - Procfile.dev-hmr
      - .github/workflows/check.yml
  pull_request:
    branches:
      - main
    paths: *check_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Check:
    runs-on: [self-hosted, linux]
    services:
      db:
        image: pgvector/pgvector:pg16
        ports: ['5432:5432']
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: |
          bundle install --jobs 4 --retry 3
          bun install --frozen-lockfile

      - name: CI
        run: bin/ci

      - name: Zeitwerk
        run: bin/rails zeitwerk:check

      - name: Lint design system
        # Blocking since 2026-09-04 (#2077). The interface rules (DS001-DS006,
        # DS011-DS014) are clean; the remaining raw-markup backlog lives in
        # DesignSystem::Lint::ALLOWLIST as rule-scoped entries, each citing the
        # reason it still exists. DS010 is informational and does not block.
        run: bin/lint-design-system

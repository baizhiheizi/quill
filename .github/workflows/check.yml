name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &check_paths
      - app/**
      - bin/**
      - config/**
      - db/**
      - lib/**
      - test/**
      - vendor/**
      - public/**
      - Gemfile
      - Gemfile.lock
      - package.json
      - bun.lock
      - config.ru
      - Rakefile
      - mise.toml
      - .ruby-version
      - .rubocop.yml
      - .prettierignore
      - esbuild.config.js
      - esbuild.inject.js
      - tsconfig.json
      - tslint.json
      - Procfile.dev
      - Procfile.dev-hmr
      - .github/workflows/check.yml
  pull_request:
    branches:
      - main
    paths: *check_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Check:
    runs-on: [self-hosted, linux]
    services:
      db:
        image: pgvector/pgvector:pg16
        ports: ['5432:5432']
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: false

      - name: Install dependencies
        run: |
          bundle install --jobs 4 --retry 3
          bun install --frozen-lockfile

      - name: Install system dependencies
        run: |
          # Runner images no longer ship a pre-warmed apt index; without this
          # every install below fails with "Unable to locate package".
          sudo apt-get update
          sudo apt-get -yyq install libpq-dev
          # Install Chrome for system tests (Selenium WebDriver 4.x auto-manages the matching driver)
          if ! command -v google-chrome-stable &>/dev/null; then
            sudo apt-get -yyq install wget
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get -yyq install /tmp/chrome.deb
          fi

      - name: CI
        run: bin/ci

      - name: Zeitwerk
        run: bin/rails zeitwerk:check

      - name: Lint design system
        # Blocking since 2026-09-04 (#2077). The interface rules (DS001-DS006,
        # DS011-DS014) are clean; the remaining raw-markup backlog lives in
        # DesignSystem::Lint::ALLOWLIST as rule-scoped entries, each citing the
        # reason it still exists. DS010 is informational and does not block.
        run: bin/lint-design-system
